[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld", "-Zshare-generics=y"]

[unstable]
codegen-backend = true

# Keep panic isolation in development: the pinned Cranelift backend cannot unwind.
[profile.dev]
codegen-backend = "llvm"

[profile.dev.package."*"]
codegen-backend = "llvm"
