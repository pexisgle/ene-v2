[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld", "-Zshare-generics=y", "-Zthreads=8"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = ["-Zshare-generics=y", "-Zthreads=8"]

[unstable]
codegen-backend = true
feature-unification = true

[resolver]
feature-unification = "workspace"

# Keep panic isolation in development: the pinned Cranelift backend cannot unwind.
[profile.dev]
codegen-backend = "llvm"

[profile.dev.package."*"]
codegen-backend = "llvm"
