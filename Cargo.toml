[workspace]
members = ["apps/*", "crates/*", "examples/plugins/*"]
resolver = "3"

[workspace.package]
version = "0.1.8"
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "deny"
large_futures = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
rest_pat_in_fully_bound_structs = "warn"
# Every `unsafe` block must state its invariant in a `// SAFETY:` comment.
# All FFI now lives in `ene-platform-os`, and every block there documents its
# invariant, so this is a hard error rather than a staged warning.
undocumented_unsafe_blocks = "deny"
# One operation per `unsafe` block keeps each `SAFETY:` claim about a single
# call, which is why the multi-call blocks in `tray.rs` were split.
multiple_unsafe_ops_per_block = "deny"
# Surfaces discarded `#[must_use]` values that `let _ = ...` hides.
# Every site now names its discard, so this is a hard error.
let_underscore_must_use = "deny"

[workspace.dependencies]
ene-rpc = { path = "crates/ene-rpc" }
ene-avatar-ipc = { path = "crates/ene-avatar-ipc" }
ene-catalog = { path = "crates/ene-catalog" }
ene-client-core = { path = "crates/ene-client-core" }
ene-domain = { path = "crates/ene-domain" }
ene-mind = { path = "crates/ene-mind" }
ene-policy = { path = "crates/ene-policy" }
ene-plugin = { path = "crates/ene-plugin" }
ene-platform-os = { path = "crates/ene-platform-os" }
ene-plugin-runtime = { path = "crates/ene-plugin-runtime" }
ene-store = { path = "crates/ene-store" }
ene-voice = { path = "crates/ene-voice" }
ene-work = { path = "crates/ene-work" }
# A Wasm guest cannot depend on the full ACP SDK, because the SDK pulls `uuid`
# without a randomness source for `wasm32-unknown-unknown`. `crates/ene-plugin`
# therefore depends on the types-only crate directly, with a caret requirement
# so the pinned ACP version can move within 1.x without breaking resolution.
agent-client-protocol-schema = { version = "1.15.1", default-features = false }
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
tempfile = "3"
async-stream = "0.3"
axum = "0.8"
base64 = "0.23"
bytes = "1"
buffa = { version = "0.9", features = ["json"] }
connectrpc = { version = "0.9", default-features = false, features = ["json"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# Pre-1.0 and explicitly unstable (docs/references.md), so the desktop client
# pins the exact version its observed API was written against.
gpui = { version = "=0.2.2", default-features = false }
http = "1"
hashlink = "0.12"
hex = "0.4"
croner = { version = "4", default-features = false, features = ["jiff"] }
rubato = "5.1"
jsonschema = "0.61"
serde_json_canonicalizer = "0.4"
jiff = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "multipart"] }
# The Rig crates share one type set and must move together; v0.46.0 is the
# surveyed baseline (docs/references.md), so an upgrade bumps all of them at once.
rig-core = { version = "=0.46.0", default-features = false }
rig-agent = "=0.46.0"
rig-ecs = "=0.46.0"
rig-memory = { version = "=0.46.0", features = ["fs"] }
rig-rmcp = "=0.46.0"
# The transports rig-rmcp re-exports are behind rmcp features it does not turn on.
rmcp = { version = "3.5", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "which-command"] }
rig-reqwest = { version = "=0.46.0", features = ["rustls"] }
rusqlite = { version = "0.42", features = ["bundled", "fallible_uint"] }
rustix = { version = "1", features = ["fs", "process"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
which = "8"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"

[profile.ci.package."*"]
opt-level = 0
debug = false
