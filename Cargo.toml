[workspace]
members = ["apps/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
buffa = { version = "0.9", features = ["json"] }
connectrpc = { version = "0.9", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = false

# Keep dependency runtime performance while reducing debug/link work.
# The test profile inherits these settings from dev.
[profile.dev.package."*"]
opt-level = 3
debug = false
