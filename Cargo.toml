[workspace]
members = ["apps/*", "crates/*", "providers/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "net", "process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std", "async-await"] }
rustix = { version = "1.1", features = ["fs", "process"] }
thiserror = "2"

[profile.dev.package."*"]
opt-level = 3
