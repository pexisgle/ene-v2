[workspace]
members = ["apps/*", "crates/*", "examples/plugins/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
ene-rpc = { path = "crates/ene-rpc" }
ene-plugin = { path = "crates/ene-plugin" }
async-stream = "0.3"
axum = "0.8"
base64 = "0.23"
buffa = { version = "0.9", features = ["json"] }
connectrpc = { version = "0.9", default-features = false, features = ["json"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
http = "1"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["macros", "sync", "time"] }
url = "2"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = false

# Keep dependency runtime performance while reducing debug/link work.
# The test profile inherits these settings from dev.
[profile.dev.package."*"]
opt-level = 3
debug = false
