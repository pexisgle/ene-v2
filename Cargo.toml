[workspace]
members = ["apps/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
buffa = { version = "0.9", features = ["json"] }
connectrpc = { version = "0.9", default-features = false, features = ["json"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
remoc = { version = "0.20", default-features = false, features = ["rtc", "codec-message-pack"] }
tokio = { version = "1", default-features = false, features = ["macros", "sync", "time"] }

[profile.dev]
opt-level = 1
debug = "full"
incremental = true

# Keep dependency runtime performance while reducing debug/link work.
# The test profile inherits these settings from dev.
[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"
