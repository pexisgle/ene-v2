[workspace]
members = ["apps/*", "crates/*", "examples/plugins/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
ene-rpc = { path = "crates/ene-rpc" }
ene-plugin = { path = "crates/ene-plugin" }
ene-plugin-runtime = { path = "crates/ene-plugin-runtime" }
agent-client-protocol = { version = "=5.0.0", default-features = false }
agent-client-protocol-schema = { version = "=1.15.1", default-features = false }
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
which = "=8.0.6"
unicode-segmentation = "1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
tempfile = "3"
xdg = "3"
async-stream = "0.3"
axum = "0.8"
base64 = "0.23"
bytes = "1"
buffa = { version = "0.9", features = ["json"] }
connectrpc = { version = "0.9", default-features = false, features = ["json"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
http = "1"
jiff = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "multipart"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", default-features = false, features = ["macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"

[profile.ci.package."*"]
opt-level = 0
debug = false
