<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アクティビティ — ene</title>
<style>
  :root {
    color-scheme: light;
    --paper: #fffdfd; --wash: #fff5f8; --ink: #3b232c; --muted: #704758;
    --line: #ead5dd; --berry: #a92455; --accent: #f9dbe8;
    font-family: Yu Gothic UI, Hiragino Sans, Meiryo, BIZ UDPGothic, Noto Sans CJK JP, sans-serif;
    font-size: 100%;
    line-height: 1.55;
    color: var(--ink); background: var(--wash);
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent); color: var(--ink); }
  body { margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--berry); outline-offset: 3px; }
  .wrap { width: min(100% - 48px, 1040px); margin-inline: auto; }
  .bar { background: var(--paper); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; align-items: center; justify-content: space-between; min-height: 58px; }
  .brand { font-size: 1.35rem; font-weight: 800; letter-spacing: -.025em; color: var(--berry); }
  .connection { display: flex; align-items: center; gap: 8px; font-size: .875rem; color: var(--muted); }
  .connection::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #a96122; }
  .connection[data-state="live"]::before { background: #237d60; }
  main { padding-block: 40px 64px; }
  h1 { font-size: 2.125rem; margin: 0; line-height: 1.25; letter-spacing: -.025em; }
  .intro { margin: 8px 0 26px; color: var(--muted); font-size: .94rem; }
  .overview { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0 0 28px; border-block: 1px solid var(--line); }
  .overview > div { padding: 14px 18px 15px; min-width: 0; }
  .overview > div:first-child { padding-left: 0; }
  .overview > div + div { border-left: 1px solid var(--line); }
  dt { font-size: .83rem; font-weight: 700; }
  dd { margin: 4px 0 0; font-size: .95rem; font-weight: 650; overflow-wrap: anywhere; }
  dd.secondary { color: var(--muted); font-size: .78rem; font-weight: 500; }
  [data-role="eyes"] { --role-bg: #dff3eb; --role-ink: #165845; }
  [data-role="hands"] { --role-bg: #fff0dd; --role-ink: #754314; }
  [data-role="head"] { --role-bg: #f9e2ec; --role-ink: #84244c; }
  .overview dt { color: var(--role-ink); }
  .timeline { border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .filters { display: flex; gap: 4px; }
  .filters button, .pause { padding: 6px 13px; min-height: 38px; border: 1px solid transparent; border-radius: 100px; background: transparent; font-size: .875rem; font-weight: 650; }
  .filters button:hover, .pause:hover { background: var(--wash); }
  .filters button[aria-pressed="true"] { color: var(--berry); background: var(--accent); }
  .pause { border-color: var(--line); }
  .pause[aria-pressed="true"] { border-color: var(--berry); color: var(--berry); }
  .hint { margin: 0; padding: 10px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .84rem; }
  .feed { list-style: none; padding: 0; margin: 0; }
  .feed li { display: grid; grid-template-columns: 84px 48px minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px 19px; }
  .feed li + li { border-top: 1px solid var(--line); }
  time, .missing-time { color: var(--muted); font-size: .84rem; font-variant-numeric: tabular-nums; padding-top: 3px; }
  .role { justify-self: start; color: var(--role-ink); background: var(--role-bg); font-size: .78rem; font-weight: 750; border-radius: 100px; padding: 2px 10px; }
  .event-title { font-weight: 700; overflow-wrap: anywhere; }
  .report-title { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 9px; }
  .report-result { padding: 1px 8px; border-radius: 100px; background: var(--wash); color: var(--muted); font-size: .77rem; }
  .report-result[data-disposition="DISPOSITION_REPLIED"] { background: var(--role-bg); color: var(--role-ink); }
  .event-detail { margin: 3px 0 0; font-size: .875rem; color: var(--muted); overflow-wrap: anywhere; }
  details { margin-top: 5px; font-size: .79rem; color: var(--muted); overflow-wrap: anywhere; }
  summary { width: fit-content; cursor: pointer; }
  details p { margin: 3px 0 0; }
  .frame-preview img { display: block; max-width: 100%; height: auto; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; }
  .frame-preview img[hidden] { display: none; }
  .report-text { white-space: pre-wrap; }
  .empty { margin: 0; padding: 46px 24px; color: var(--muted); text-align: center; font-size: .94rem; }
  @media (max-width: 600px) {
    .wrap { width: calc(100% - 28px); }
    main { padding-top: 27px; }
    h1 { font-size: 1.7rem; }
    .overview > div { padding-inline: 10px; }
    dd { font-size: .83rem; }
    .toolbar { padding-inline: 10px; gap: 6px; }
    .filters button, .pause { padding-inline: 9px; }
    .feed li { padding: 12px; grid-template-columns: 67px 37px minmax(0, 1fr); gap: 7px; }
    time, .missing-time { font-size: .75rem; }
    .role { padding-inline: 7px; }
  }
</style>
<header class="bar"><div class="wrap">
  <span class="brand">ene</span>
  <span id="connection" class="connection" data-state="waiting" role="status">接続を確認中</span>
</div></header>
<main class="wrap">
  <h1>アクティビティ</h1>
  <p class="intro">目が見たこと、手の作業、頭の応答を時系列で確認できます。</p>
  <dl class="overview" aria-label="各役割の最新の動き">
    <div data-role="eyes"><dt>目 · 観測</dt><dd id="latest-eyes">ログ待ち</dd><dd id="last-screen" class="secondary" hidden></dd></div>
    <div data-role="hands"><dt>手 · 作業</dt><dd id="latest-hands">ログ待ち</dd></div>
    <div data-role="head"><dt>頭 · 応答</dt><dd id="latest-head">ログ待ち</dd></div>
  </dl>
  <section class="timeline" aria-label="アクティビティの履歴">
    <div class="toolbar">
      <div class="filters" role="group" aria-label="役割で絞り込み">
        <button type="button" data-filter="all" aria-pressed="true">すべて</button>
        <button type="button" data-filter="eyes" aria-pressed="false">目</button>
        <button type="button" data-filter="hands" aria-pressed="false">手</button>
        <button type="button" data-filter="head" aria-pressed="false">頭</button>
      </div>
      <button type="button" id="pause" class="pause" aria-pressed="false">一時停止</button>
    </div>
    <p id="hint" class="hint" hidden role="status"></p>
    <ol class="feed" id="feed" aria-label="新しい順のイベント"></ol>
    <p class="empty" id="empty">ホストに接続して、アクティビティを表示します。</p>
  </section>
</main>
<script>
  const roles = {eyes: '目', hands: '手', head: '頭'};
  const eventLabels = {
    enabled: '観測を開始', paused: '観測を停止', window_changed: '前面ウィンドウが変化',
    screen_received: '画面を受信', watch_matched: '監視条件に一致', delivered: '頭に報告',
    tool_requested: 'ツールを呼び出し', tool_settled: 'ツールの処理が終了', approval: '確認が必要',
  };
  const decisions = {
    queued: '報告待ち', important_queued: '重要な報告を優先', important_duplicate: '同じ重要な内容のため見送り',
    not_important: '報告を見送り', duplicate: '同じ内容のため見送り',
    cooldown: '前回の自動報告から1分未満のため見送り', watch_priority: '監視条件を優先',
    unavailable: 'モデルが未接続', failed: '評価に失敗',
  };
  const statuses = {
    TURN_STATUS_STREAMING: '応答を開始', TURN_STATUS_ANSWERED: '応答が完了',
    TURN_STATUS_STOPPED: '応答を停止', TURN_STATUS_FAILED: '応答に失敗',
    RUN_STATUS_COMPLETED: '作業が完了', RUN_STATUS_CANCELLED: '作業を中止',
    RUN_STATUS_FAILED: '作業に失敗', RUN_STATUS_WAITING_INPUT: '確認待ち',
    WORK_STATUS_ACTIVE: '作業中', WORK_STATUS_IDLE: '待機中', WORK_STATUS_CLOSED: '作業を終了',
  };
  const reportResults = {
    DISPOSITION_WATCHED: '静観', DISPOSITION_REPLIED: '返答あり', DISPOSITION_NO_REPLY: '返答なし',
    TURN_STATUS_STOPPED: '中断', TURN_STATUS_FAILED: '判断に失敗',
  };
  const observationInputs = {
    image: 'モデル入力に画像あり', no_frame: '画像が未到着',
    model_text_only: '画像非対応のモデル', model_unavailable: 'モデルが未接続',
  };
  const feed = document.querySelector('#feed');
  const empty = document.querySelector('#empty');
  const hint = document.querySelector('#hint');
  const pause = document.querySelector('#pause');
  const connection = document.querySelector('#connection');
  const lastScreen = document.querySelector('#last-screen');
  const filters = [...document.querySelectorAll('[data-filter]')];
  const rows = [];
  const cursor = new Map();
  let filter = 'all';
  let paused = false;
  let frozen = [];
  let unseen = 0;
  let live = false;
  let gap = false;
  let limited = false;

  function describe(row) {
    const d = row.detail || {};
    switch (row.action) {
      case 'evaluated':
        return ['観測を評価 · ' + (decisions[d.decision] || '結果を受信'),
          [observationInputs[d.input] || (d.image ? '画像あり' : 'イベントのみ'), d.summary].filter(Boolean).join(' ／ ')];
      case 'screen_received': return [eventLabels[row.action], Math.ceil(d.bytes / 1024) + ' KB の画像'];
      case 'activity_changed': return [d.active ? '操作中に戻った' : '離席を検知',
        d.active ? '' : d.idle_seconds + '秒間、操作なし'];
      case 'watch_matched': return [eventLabels[row.action], d.transition];
      case 'delivered': return [d.important ? '頭に重要な報告' : eventLabels[row.action], d.summary || (d.watch ? '監視条件が発動' : '観測した変化を報告')];
      case 'model_status':
        return [{image: '画像対応モデルを使用', events: '活動イベントを評価',
          unavailable: 'モデルが未接続'}[d.status] || 'モデル設定が変化', ''];
      case 'turn': return d.report_id ? [reportResult(d), '目の報告を受けて']
        : [statuses[d.status] || '応答の状態が変化', ''];
      case 'work': return [statuses[d.status] ||
        (d.kind === 'WORK_EVENT_KIND_RUN_STARTED' ? '作業を開始' : '作業の状態が変化'), ''];
      default: return [eventLabels[row.action] || '状態が変化', d.tool || ''];
    }
  }

  function node(tag, value, className) {
    const element = document.createElement(tag);
    if (value) element.textContent = value;
    if (className) element.className = className;
    return element;
  }

  function overviewTitle(row) {
    return row.action === 'evaluated' ? (decisions[row.detail.decision] || '評価済み') : describe(row)[0];
  }

  function latestFor(role, source) {
    const latestTurn = role === 'head' && source.find(row => row.action === 'turn');
    return latestTurn || source.find(row => row.role === role);
  }

  function reportResult(detail) {
    return reportResults[detail.disposition] || reportResults[detail.status] || '判断待ち';
  }

  function setReportResult(badge, detail) {
    badge.textContent = reportResult(detail);
    badge.dataset.disposition = detail.disposition || '';
  }

  function line(row, source) {
    const li = node('li');
    li.dataset.role = row.role;
    const time = row.at
      ? node('time', new Date(row.at).toLocaleTimeString('ja-JP'))
      : node('span', '時刻不明', 'missing-time');
    if (row.at) time.dateTime = row.at;
    const [title, message] = describe(row);
    const content = node('div');
    const titleNode = node('div', title, 'event-title');
    content.append(titleNode);
    const sub = [row.companion, message].filter(Boolean).join(' · ');
    if (sub) content.append(node('p', sub, 'event-detail'));
    const d = row.detail || {};
    if (d.reply) content.append(node('p', d.reply, 'event-detail report-text'));
    if (d.frame_id) {
      const label = row.action === 'evaluated' ? '評価に使った画像を表示' : '受信した画像を表示';
      const preview = node('details', '', 'frame-preview');
      const image = node('img');
      const unavailable = node('p', 'この画像は取得できません。接続を確認し、時刻の新しい「画面を受信」から開いてください。');
      image.alt = label.replace(/を表示$/, '');
      image.hidden = unavailable.hidden = true;
      image.onload = () => { image.hidden = false; };
      image.onerror = () => { unavailable.hidden = false; };
      preview.addEventListener('toggle', () => {
        image.hidden = unavailable.hidden = true;
        if (preview.open) image.src = 'frame/' + encodeURIComponent(d.frame_id);
        else image.removeAttribute('src');
      });
      preview.append(node('summary', label), image, unavailable);
      content.append(preview);
    }
    if (row.action === 'delivered' && d.report_id) {
      const result = source.find(item => item.action === 'turn' && item.detail.report_id === d.report_id);
      const badge = node('span', '', 'report-result');
      badge.id = 'report-' + d.report_id;
      setReportResult(badge, result?.detail || {});
      titleNode.classList.add('report-title');
      titleNode.append(badge);
    }
    const fields = [['ターン', d.turn_id], ['作業', d.work_id], ['実行', d.run_id],
      ['呼び出し', d.call_id], ['エラー', d.failure]].filter(([, value]) => value);
    if (fields.length) {
      const details = node('details');
      details.append(node('summary', '詳細'));
      for (const [label, value] of fields) details.append(node('p', label + ' ' + value));
      content.append(details);
    }
    li.append(time, node('span', roles[row.role], 'role'), content);
    return li;
  }

  function status() {
    connection.dataset.state = live ? 'live' : 'waiting';
    connection.textContent = live ? 'ライブ接続中' : 'ホストの起動を待っています';
    hint.hidden = !paused && !gap && !limited;
    hint.textContent = paused ? (unseen ? `一時停止中 · 新着 ${unseen} 件` : '一時停止中')
      : limited ? '画面の受信・評価やツールの詳細は、新しい ene-host の起動後に表示されます。'
      : '接続が切り替わったため、一部の履歴を再取得できませんでした。';
    empty.hidden = feed.childElementCount > 0;
    empty.textContent = live
      ? (filter === 'all' ? '新しい動きがあると、ここに表示されます。' : 'この役割のログはまだありません。')
      : 'ホストに接続すると、アクティビティを表示します。';
  }

  function draw() {
    const visibleRows = paused ? frozen : rows;
    feed.replaceChildren(...visibleRows.filter(row => filter === 'all' || row.role === filter)
      .map(row => line(row, visibleRows)));
    for (const role of Object.keys(roles)) {
      const recent = latestFor(role, visibleRows);
      document.querySelector('#latest-' + role).textContent = recent ? overviewTitle(recent) : 'ログ待ち';
    }
    const screen = visibleRows.find(row => row.action === 'screen_received');
    lastScreen.hidden = !screen;
    lastScreen.textContent = screen ? '画面受信 ' + new Date(screen.at).toLocaleTimeString('ja-JP') : '';
    status();
  }

  for (const button of filters) button.addEventListener('click', () => {
    filter = button.dataset.filter;
    for (const other of filters) other.setAttribute('aria-pressed', other === button);
    draw();
  });
  pause.addEventListener('click', () => {
    paused = !paused;
    pause.setAttribute('aria-pressed', paused);
    pause.textContent = paused ? '表示を再開' : '一時停止';
    if (paused) { frozen = rows.slice(); status(); }
    else { frozen = []; unseen = 0; draw(); }
  });

  const events = new EventSource('events');
  events.addEventListener('status', event => {
    const state = JSON.parse(event.data);
    live = state.state === 'live';
    limited = Boolean(state.limited);
    gap ||= Boolean(state.gap);
    status();
  });
  events.onerror = () => { live = false; status(); };
  events.addEventListener('row', event => {
    const row = JSON.parse(event.data);
    if (!Object.hasOwn(roles, row.role)) return;
    if (row.epoch && row.sequence !== '') {
      const next = BigInt(row.sequence);
      if (next <= (cursor.get(row.epoch) ?? -1n)) return;
      cursor.set(row.epoch, next);
    }
    rows.unshift(row);
    if (rows.length > 300) rows.pop();
    if (paused) { unseen++; status(); return; }
    if (filter === 'all' || row.role === filter) feed.prepend(line(row, rows));
    if (row.action === 'turn' && row.detail.report_id) {
      const badge = document.getElementById('report-' + row.detail.report_id);
      if (badge) setReportResult(badge, row.detail);
    }
    if (feed.childElementCount > 300) feed.lastElementChild.remove();
    document.querySelector('#latest-' + row.role).textContent = overviewTitle(latestFor(row.role, rows));
    if (row.action === 'screen_received') {
      lastScreen.hidden = false;
      lastScreen.textContent = '画面受信 ' + new Date(row.at).toLocaleTimeString('ja-JP');
    }
    status();
  });
</script>
</html>
