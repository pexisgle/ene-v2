[graph]
all-features = true

[advisories]
ignore = [
    # Only keep RUSTSEC-2026-0587 here if `cargo update -p wasmtime -p wasmtime-wasi` cannot resolve it within ^49.

    # `unmaintained` advisories for crates reached only through a dependency
    # tree this workspace does not control: gpui's text stack, the desktop's
    # zbus path, extism's wasm host and rig's HTTP stack. None is a security
    # advisory; each needs an upstream release to clear. Ignoring them is what
    # lets `cargo deny check` keep gating the yanked and vulnerable cases that
    # do matter. Remove an entry once its crate leaves the tree.
    "RUSTSEC-2024-0384",  # instant
    "RUSTSEC-2024-0436",  # paste
    "RUSTSEC-2025-0134",  # rustls-pemfile
    "RUSTSEC-2026-0192",  # rustybuzz
    "RUSTSEC-2026-0206",  # zvariant
    "RUSTSEC-2026-0370",  # zbus_names
    "RUSTSEC-2026-0371",  # zvariant_derive
    "RUSTSEC-2026-0372",  # pin-utils
    "RUSTSEC-2026-0543",  # ttf-parser, second path
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

# `ene-rpc` is the wire protocol crate. Only these three may depend on it; every
# other crate, including every L0 domain crate, is denied if it reaches
# `ene-rpc` directly or through another crate. `deny.toml` reads the resolved
# dependency graph, so this catches an indirect path that scraping `Cargo.toml`
# files would miss.
[[bans.deny]]
name = "ene-rpc"
wrappers = ["ene-client-core", "ene-desktop", "ene-host"]
reason = "the wire protocol crate belongs to the transport and app layers only"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
