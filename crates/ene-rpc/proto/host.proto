syntax = "proto3";
package ene.host.v1;

// Provider and plugin-specific extension objects use JSON; API operations and events
// have concrete protobuf types. JSON text preserves arbitrary integer precision.
message JsonDocument { string json = 1; }
message Empty {}
message Id { string id = 1; }
message Cursor { string epoch = 1; uint64 seq = 2; }
message Failure { string code = 1; string message = 2; JsonDocument details = 3; }
message ApiFailure { Failure error = 1; string request_id = 2; uint32 http_status = 3; }
message ModelAssignment { string connection_id = 1; string model_id = 2; }
message ModelAssignments { ModelAssignment companion = 1; ModelAssignment task = 2; }
message Message {
  string id = 1; string companion_id = 2; string role = 3; string text = 4;
  string status = 5; string created_at = 6; uint64 sequence = 7;
  repeated JsonDocument resources = 8; optional string in_reply_to = 9;
  optional string task_id = 10; optional string question_id = 11; Failure failure = 12;
  // The accepted input this entry or reply belongs to. A reply carries the id
  // of the input it answers; the id is the same value SendMessage returned.
  optional string request_id = 13;
}
message Companion {
  string id = 1; string name = 2; JsonDocument body = 3; JsonDocument voice = 4;
  string mind = 5; ModelAssignments model_assignments = 6;
  JsonDocument availability = 7; uint64 revision = 8;
}
message Connection {
  string id = 1; string kind = 2; string adapter = 3; string endpoint = 4;
  JsonDocument options = 5; string credential_state = 6;
  JsonDocument capabilities = 7; JsonDocument last_check = 8;
}
message Settings { uint64 revision = 1; repeated Connection connections = 2; }
message Grant {
  string id = 1; string companion_id = 2; string kind = 3; string connection_id = 4;
  repeated string destinations = 5; repeated string data_kinds = 6;
  string purpose = 7; string status = 8; uint64 revision = 9;
  optional string invalidation_reason = 10; JsonDocument connection_fingerprint = 11;
}
message HostHealth {
  bool ready = 1; bool recovery_required = 2; bool stopping = 3;
  uint64 credential_cleanup_pending = 4;
}
message HistoryCursor { optional string value = 1; }
message Snapshot {
  string host_id = 1; string environment_id = 2; JsonDocument capabilities = 3;
  Cursor cursor = 4; repeated Companion companions = 5; repeated Message messages = 6;
  map<string, HistoryCursor> message_cursors = 7; Settings settings = 8;
  repeated Grant grants = 9; HostHealth health = 10;
}
message SnapshotRequest { optional string subscription_id = 1; }
message Companions { repeated Companion items = 1; }
message ConnectionInput {
  optional string id = 1; bool create = 2; string kind = 3; string adapter = 4;
  string endpoint = 5; JsonDocument options = 6;
}
message ConnectionInputs { repeated ConnectionInput items = 1; }
message UpdateSettingsRequest {
  uint64 revision = 1;
  // The former repeated field cannot represent omission; never reuse its tag.
  reserved 2;
  // Absent keeps the list; a present empty message removes all unreferenced connections.
  ConnectionInputs connections = 3;
}
// Absent fields keep their value. Assignment changes explicitly set or clear a slot.
message AssignmentPatch { oneof change { ModelAssignment set = 1; Empty clear = 2; } }
// An absent patch keeps the document. A present patch must select set or clear.
// JSON null is omission, not clear; set requires a non-null JSON object.
message JsonDocumentPatch { oneof change { JsonDocument set = 1; Empty clear = 2; } }
message UpdateCompanionRequest {
  string id = 1; uint64 revision = 2; optional string name = 3; optional string mind = 4;
  AssignmentPatch companion_assignment = 5; AssignmentPatch task_assignment = 6;
  JsonDocumentPatch body = 7; JsonDocumentPatch voice = 8;
}
message HistoryRequest {
  string companion_id = 1; optional string cursor = 2; optional uint32 limit = 3;
}
message History { repeated Message items = 1; optional string next_cursor = 2; }
message MessageRequest { string companion_id = 1; string message_id = 2; }
message SendMessageRequest {
  string companion_id = 1; string text = 2; string request_key = 3;
  repeated JsonDocument resources = 4; optional string question_id = 5; optional string decision = 6;
}
// The host has taken responsibility for the input. Delivery, execution and its
// end are confirmed by MessageCreated, TurnEvent and GetHistory, not here.
message MessageAcceptance { string request_id = 1; reserved 2, 3; reserved "message_id", "response_message_id"; }
message GrantsRequest { optional string companion_id = 1; }
message Grants { repeated Grant items = 1; }
message Consent { uint64 settings_revision = 1; string provider_revision = 2; }
message CreateGrantRequest {
  string request_key = 1; string companion_id = 2; string kind = 3; string connection_id = 4;
  repeated string destinations = 5; repeated string data_kinds = 6;
  string purpose = 7; Consent consent = 8;
}
message UpdateGrantRequest {
  string id = 1; uint64 revision = 2; StringList destinations = 3;
  StringList data_kinds = 4;
}
message GrantResult { Grant grant = 1; }
message CredentialRequest { string id = 1; optional string secret = 2; optional string source = 3; }
message CredentialResult { string credential_state = 1; }
message CheckRequest {
  string id = 1; string request_key = 2; string companion_id = 3;
  string purpose = 4; optional string model_id = 5;
}
message CheckResult {
  string request_id = 1; JsonDocument capabilities = 2; bool success = 3;
  string model_id = 4; uint64 content_chunks = 5; uint64 unicode_scalars = 6;
}
message StringList { repeated string values = 1; }
message ModelMetadata {
  string source = 1; string scope = 2; optional uint64 context_window = 3;
  optional uint64 max_input_tokens = 4; optional uint64 max_output_tokens = 5;
  StringList input_modalities = 6; StringList output_modalities = 7;
  StringList supported_parameters = 8; map<string, string> field_sources = 9;
}
message Model { string id = 1; string name = 2; ModelMetadata metadata = 3; }
message Models { repeated Model items = 1; }
message ModelsRequest { string id = 1; optional string companion_id = 2; }
message SettingField {
  string key = 1; string label = 2; string kind = 3;
  bool required = 4; repeated string choices = 5;
}
message ProviderCapabilities { bool streaming_text = 1; bool model_list = 2; }
message Provider {
  string id = 1; string name = 2; string kind = 3; string endpoint = 4;
  JsonDocument options = 5; repeated SettingField settings = 6;
  bool requires_credentials = 7; optional string environment_variable = 8;
  repeated string destinations = 9; string state = 10; optional string error = 11;
  string revision = 12; ProviderCapabilities capabilities = 13; repeated Model models = 14;
}
message Providers { repeated Provider items = 1; }
message PluginEntry {
  string id = 1; string target = 2;
  reserved 3;
  reserved "runtime";
  repeated string provides = 4; repeated string uses = 5;
}
message Plugin {
  string id = 1; string name = 2; string version = 3; string revision = 4;
  string state = 5; optional string error = 6; repeated PluginEntry entrypoints = 7;
}
message Plugins { repeated Plugin items = 1; }
message EnablePluginRequest { string id = 1; bool enabled = 2; string revision = 3; }
// Explicit opt-in for the ACP terminal capability. Commands are executed
// directly (no shell) as the host user; there is no sandbox.
message TerminalPolicy {
  bool enabled = 1;
  repeated string allowed_commands = 2;
  uint32 max_seconds = 3;
  uint32 max_output_bytes = 4;
}
message PluginBinding {
  string id = 1; string plugin_id = 2; string entrypoint = 3; string revision = 4;
  string companion_id = 5; repeated string services = 6; JsonDocument configuration = 7;
  // Required for character entrypoints; actions are scoped to this device and companion_id.
  string device_id = 8;
  // Absolute workspace root for the `tools` fs capabilities; empty disables them.
  optional string workspace_root = 9;
  // ACP bindings only. Absent or disabled means terminal requests are rejected.
  optional TerminalPolicy terminal = 10;
}
message PluginBindings { repeated PluginBinding items = 1; }
message PluginInvocation { string binding_id = 1; JsonDocument operation = 2; }
message PluginResult { uint64 generation = 1; repeated JsonDocument events = 2; JsonDocument result = 3; }
// Harness task state is read from the host journal; the notification is a hint to re-read.
message HarnessState { string binding_id = 1; JsonDocument state = 2; }
message HarnessTaskNotification {
  string binding_id = 1; string companion_id = 2; string task_id = 3;
  string status = 4; optional string stop_reason = 5; optional string failure = 6;
}
message CharacterActionNotification {
  string binding_id = 1; string revision = 2; uint64 generation = 3;
  uint64 expires_at_ms = 4; JsonDocument event = 5;
}
message EnableProviderRequest { string id = 1; bool enabled = 2; }
message AvailabilityRequest { string connection_id = 1; string companion_id = 2; }
message OperationAvailability {
  string operation = 1; string purpose = 2; repeated string data_kinds = 3;
  string authorization = 4; string dependency = 5; bool busy = 6; bool runnable = 7;
}
message Availability {
  string companion_id = 1; string connection_id = 2; uint64 settings_revision = 3;
  optional string provider_revision = 4; repeated string destinations = 5;
  JsonDocument connection_fingerprint = 6; repeated OperationAvailability operations = 7;
}
// Progress of the reply to the input its stream_id names. The final text is the
// message TurnEvent reports; deltas are not the saved conversation.
message MessageDelta { string stream_id = 1; uint64 offset = 2; string delta = 3; }
// One execution of a companion from an accepted input to its end. `state` is
// streaming, answered, stopped or failed. `message_id` is the saved reply entry
// when one exists. Streaming is also reported as MessageDelta with this stream_id.
message TurnEvent {
  string companion_id = 1; string stream_id = 2; string state = 3;
  optional string request_id = 4; optional string message_id = 5; Failure failure = 6;
}
message PersistenceFailure { optional string message_id = 1; string code = 2; string message = 3; }
// The host's execution kernel stopped and no running turn will be answered.
message HostFailure { string code = 1; string message = 2; }
// A failed turn took the user's unanswered input out of the saved conversation;
// the client puts this text back in its input. It is not a conversation message.
message RecalledInput { string companion_id = 1; string text = 2; optional string reason = 3; }
message Notification {
  Cursor cursor = 1; optional string companion_id = 2;
  // The former message-start/update and generation-failure events; the turn
  // event carries their meaning now.
  reserved 4, 5, 11;
  reserved "message_started", "message_updated", "generation_persistence_failed";
  oneof event {
    Message message_created = 3;
    MessageDelta message_delta = 6; Companion companion_updated = 7;
    Settings settings_updated = 8; Grants grants_updated = 9;
    PersistenceFailure host_storage_failed = 10;
    CharacterActionNotification plugin_character_action = 12;
    HarnessTaskNotification harness_task = 13;
    TurnEvent turn_event = 14;
    HostFailure host_failure = 15;
    RecalledInput recalled_input = 16;
  }
}
message InitialState { string subscription_id = 1; Snapshot snapshot = 2; }
message ResyncRequired {}
message HostEvent {
  oneof event { InitialState initial = 1; Notification notification = 2; ResyncRequired resync_required = 3; }
}

// Device operations travel over a client-originated subscription. IDs identify
// one operation; reconnecting never implicitly executes an uncertain command.
message Device {
  string id = 1; repeated string capabilities = 2; bool approved = 3;
  string name = 4; repeated string permissions = 5; bool revoked = 6;
}
message DeviceRegistration { Device device = 1; string token = 2; }
message RegisterDeviceRequest { string name = 1; repeated string capabilities = 2; }
message Devices { repeated Device items = 1; }
message DevicePermissionRequest { string device_id = 1; string capability = 2; bool allowed = 3; }
message DeviceOperationRequest {
  string device_id = 1; string operation_id = 2; string capability = 3; JsonDocument input = 4;
}
message DeviceOperation { string operation_id = 1; string capability = 2; JsonDocument input = 3; string subscription_id = 4; }
message DeviceSubscription { string subscription_id = 1; }
message DeviceEvent { oneof event { DeviceSubscription ready = 1; DeviceOperation operation = 2; } }
message DeviceOperationResult {
  string device_id = 1; string operation_id = 2; bool success = 3; JsonDocument output = 4; string subscription_id = 5;
}
enum OperationStatus { OPERATION_STATUS_UNSPECIFIED = 0; OPERATION_STATUS_DISPATCHED = 1; OPERATION_STATUS_COMPLETED = 2; OPERATION_STATUS_UNCERTAIN = 3; OPERATION_STATUS_REVOKED = 4; }
message DeviceOperationState { string operation_id = 1; OperationStatus status = 2; DeviceOperationResult result = 3; }
// Host-private durable records use the same generated messages, never JSON DTO copies.
message DeviceRecord { Device device = 1; bytes token_hash = 2; }
message OperationRecord { DeviceOperationRequest request = 1; DeviceOperationState state = 2; string subscription_id = 3; }
message DeviceJournal { repeated DeviceRecord devices = 1; repeated OperationRecord operations = 2; uint64 activation_revision = 3; }
message ActivationRequest { string companion_id = 1; string device_id = 2; optional uint64 expected_revision = 3; bool release = 4; }
message Activation { string companion_id = 1; string device_id = 2; uint64 revision = 3; uint32 lease_ms = 4; }
message StopRequest { string companion_id = 1; }

// A protobuf message occupies exactly one binary WebSocket message. Audio
// codecs are negotiated by Start; no bespoke binary header is used.
message PrepareAudioRequest { string companion_id = 1; string device_id = 2; string codec = 3; uint32 sample_rate = 4; uint32 channels = 5; }
message AudioStart {
  string session_id = 1; string companion_id = 2; string device_id = 3;
  string codec = 4; uint32 sample_rate = 5; uint32 channels = 6; uint64 generation = 7;
}
message AudioChunk { string session_id = 1; uint64 sequence = 2; bytes data = 3; }
message AudioEnd { string session_id = 1; }
message AudioFailure { string session_id = 1; string code = 2; }
message AudioFrame {
  oneof frame { AudioStart start = 1; AudioChunk chunk = 2; AudioEnd end = 3; AudioFailure failure = 4; }
}

service HostService {
  rpc GetSnapshot(SnapshotRequest) returns (Snapshot);
  rpc Subscribe(Empty) returns (stream HostEvent);
  rpc ListCompanions(Empty) returns (Companions);
  rpc GetCompanion(Id) returns (Companion);
  rpc UpdateCompanion(UpdateCompanionRequest) returns (Companion);
  rpc GetHistory(HistoryRequest) returns (History);
  rpc GetMessage(MessageRequest) returns (Message);
  rpc SendMessage(SendMessageRequest) returns (MessageAcceptance);
  rpc Stop(StopRequest) returns (Empty);
  rpc PrepareAudio(PrepareAudioRequest) returns (AudioStart);
  rpc GetSettings(Empty) returns (Settings);
  rpc UpdateSettings(UpdateSettingsRequest) returns (Settings);
  rpc ListGrants(GrantsRequest) returns (Grants);
  rpc CreateGrant(CreateGrantRequest) returns (GrantResult);
  rpc UpdateGrant(UpdateGrantRequest) returns (GrantResult);
  rpc RevokeGrant(Id) returns (Empty);
  rpc RegisterCredentials(CredentialRequest) returns (CredentialResult);
  rpc RevokeCredentials(Id) returns (Empty);
  rpc CheckConnection(CheckRequest) returns (CheckResult);
  rpc ListModels(ModelsRequest) returns (Models);
  rpc ListProviders(Empty) returns (Providers);
  rpc ReloadProviders(Empty) returns (Providers);
  rpc EnableProvider(EnableProviderRequest) returns (Providers);
  rpc GetAvailability(AvailabilityRequest) returns (Availability);
}
service PluginService {
  rpc List(Empty) returns (Plugins);
  rpc Get(Id) returns (Plugin);
  rpc Reload(Empty) returns (Plugins);
  rpc Enable(EnablePluginRequest) returns (Plugins);
  rpc ListBindings(Empty) returns (PluginBindings);
  rpc Bind(PluginBinding) returns (PluginBindings);
  rpc Invoke(PluginInvocation) returns (PluginResult);
  rpc GetHarness(Id) returns (HarnessState);
}
service DeviceService {
  rpc RegisterDevice(RegisterDeviceRequest) returns (DeviceRegistration);
  rpc List(Empty) returns (Devices);
  rpc Approve(Id) returns (Device);
  rpc Revoke(Id) returns (Empty);
  rpc SetPermission(DevicePermissionRequest) returns (Empty);
  rpc Subscribe(Id) returns (stream DeviceEvent);
  rpc RequestOperation(DeviceOperationRequest) returns (DeviceOperationState);
  rpc CompleteOperation(DeviceOperationResult) returns (DeviceOperationState);
  rpc GetOperation(DeviceOperationRequest) returns (DeviceOperationState);
  rpc Activate(ActivationRequest) returns (Activation);
}
