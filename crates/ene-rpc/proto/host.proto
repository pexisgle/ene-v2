syntax = "proto3";

package ene.host.v2;

message Empty {}
message Id {
  string id = 1;
}
message Mutation {
  string request_key = 1;
  int64 revision = 2;
}
message Receipt {
  string id = 1;
  string session_id = 2;
}
message Cursor {
  string epoch = 1;
  uint64 sequence = 2;
}
message Snapshot {
  Cursor cursor = 1;
  repeated Character characters = 2;
  repeated Companion companions = 3;
  repeated Approval approvals = 4;
  repeated Device devices = 5;
  repeated Activation activations = 6;
  repeated WorkSession work = 7;
}
message SubscribeRequest {
  Cursor after = 1;
}
message Event {
  Cursor cursor = 1;
  oneof payload {
    Snapshot snapshot = 2;
    Message message = 3;
    TextDelta delta = 4;
    TurnState turn = 5;
    WorkSession work = 6;
    Approval approval = 7;
    Activation activation = 8;
    Notice notice = 9;
  }
}
message Notice {
  string companion_id = 1;
  string text = 2;
}
message Profile {
  string name = 1;
  string persona = 2;
  string speech = 3;
  repeated string facets = 4;
  repeated string examples = 5;
  repeated string background = 6;
  repeated string expressions = 7;
}
message Character {
  string id = 1;
  int64 revision = 2;
  Profile profile = 3;
  string avatar = 4;
  string voice = 5;
}
message Companion {
  string id = 1;
  int64 revision = 2;
  string character_id = 3;
  string name = 4;
  repeated ModelSelection models = 5;
}
message CharacterChange {
  Mutation mutation = 1;
  Character character = 2;
}
message CompanionChange {
  Mutation mutation = 1;
  Companion companion = 2;
}
message DeleteRequest {
  Mutation mutation = 1;
  string id = 2;
}
message PreviewRequest {
  Profile profile = 1;
  ModelSelection model = 2;
  string input = 3;
}
message Text {
  string text = 1;
}
message CharacterPackage {
  uint32 version = 1;
  optional Profile profile = 2;
  optional string avatar_name = 3;
  bytes avatar = 4;
  optional string voice = 5;
  repeated string warnings = 6;
}
message ExportRequest {
  string id = 1;
  bool profile = 2;
  bool avatar = 3;
  bool voice = 4;
}
message ImportRequest {
  Mutation mutation = 1;
  CharacterPackage package = 2;
  string character_id = 3;
}
message Mind {
  int64 revision = 1;
  string emotion = 2;
  string relationship = 3;
  repeated string tendencies = 4;
  repeated string interests = 5;
  int64 observed_at = 6;
}
message MindChange {
  Mutation mutation = 1;
  string companion_id = 2;
  Mind mind = 3;
}
message Memory {
  string id = 1;
  int64 revision = 2;
  string companion_id = 3;
  bool shared = 4;
  string text = 5;
  uint32 importance = 6;
  string provenance = 7;
  string superseded_by = 8;
}
message MemoryQuery {
  string companion_id = 1;
  string query = 2;
  uint32 limit = 3;
}
message Memories {
  repeated Memory items = 1;
}
message MemoryChange {
  Mutation mutation = 1;
  Memory memory = 2;
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_REMEMBER = 1;
    OPERATION_CORRECT = 2;
    OPERATION_FORGET = 3;
    OPERATION_SHARE = 4;
    OPERATION_ERASE = 5;
  }
  Operation operation = 3;
}
message SendRequest {
  Mutation mutation = 1;
  string companion_id = 2;
  string text = 3;
}
message Message {
  string id = 1;
  string companion_id = 2;
  string turn_id = 3;
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_USER = 1;
    ROLE_ASSISTANT = 2;
    ROLE_TRIGGER = 3;
  }
  Role role = 4;
  string text = 5;
  int64 created_at = 6;
  uint64 position = 7;
}
message TextDelta {
  string companion_id = 1;
  string turn_id = 2;
  string text = 3;
  bool reset = 4;
}
message StopRequest {
  Mutation mutation = 1;
  string id = 2;
}
message TurnState {
  string companion_id = 1;
  string turn_id = 2;
  Outcome outcome = 3;
}
enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_RUNNING = 1;
  OUTCOME_COMPLETED = 2;
  OUTCOME_STOPPED = 3;
  OUTCOME_FAILED = 4;
  OUTCOME_UNKNOWN = 5;
}
message HistoryRequest {
  string companion_id = 1;
  uint64 before = 2;
  uint32 limit = 3;
}
message History {
  repeated Message messages = 1;
  uint64 next_before = 2;
}
enum ProviderKind {
  PROVIDER_KIND_UNSPECIFIED = 0;
  PROVIDER_KIND_OPENAI_COMPATIBLE = 1;
  PROVIDER_KIND_MCP_HTTP = 2;
  PROVIDER_KIND_MCP_STDIO = 3;
  PROVIDER_KIND_PLUGIN = 4;
  PROVIDER_KIND_NATIVE = 5;
  PROVIDER_KIND_VOICEVOX = 6;
  PROVIDER_KIND_SEARCH = 7;
}
message Connection {
  string id = 1;
  int64 revision = 2;
  string name = 3;
  ProviderKind kind = 4;
  string endpoint = 5;
  string command = 6;
  repeated string args = 7;
  string plugin_id = 8;
  string entrypoint = 9;
  bool credential_configured = 10;
  repeated string send_data = 11;
  bool enabled = 12;
  optional string credential_env = 13;
  string options_json = 14;
  McpToolScope mcp_tools = 15;
  string adapter = 16;
}
message McpToolScope {
  bool all = 1;
  repeated string names = 2;
}
message ModelSelection {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_DIALOGUE = 1;
    ROLE_WORK = 2;
    ROLE_PERCEPTION = 3;
    ROLE_REFLECTION = 4;
    ROLE_POLICY = 5;
    ROLE_EMBEDDING = 6;
    ROLE_SYNTHESIS = 7;
    ROLE_TRANSCRIPTION = 8;
  }
  Role role = 1;
  string connection_id = 2;
  string model = 3;
  uint32 context_bytes = 4;
}
message Settings {
  repeated Connection connections = 1;
  Policy policy = 2;
  repeated Rule rules = 3;
  repeated Plugin plugins = 4;
}
message ConnectionChange {
  Mutation mutation = 1;
  Connection connection = 2;
}
message CredentialChange {
  Mutation mutation = 1;
  string connection_id = 2;
  optional string secret = 3;
}
message ModelList {
  repeated string ids = 1;
}
message ProbeRequest {
  string connection_id = 1;
  ModelSelection model = 2;
  string voice = 3;
}
message Policy {
  int64 revision = 1;
  string text = 2;
  bool full_access = 3;
  repeated string always_confirm = 4;
}
message PolicyChange {
  Mutation mutation = 1;
  Policy policy = 2;
}
message Rule {
  string digest = 1;
  string operation = 2;
  string receiver = 3;
  string effect = 4;
  bool allow = 5;
}
message AuditQuery {
  uint64 before = 1;
  uint32 limit = 2;
}
message AuditEntry {
  uint64 position = 1;
  int64 time = 2;
  string operation = 3;
  string decision = 4;
  string source = 5;
}
message Audit {
  repeated AuditEntry items = 1;
}
message Approval {
  string id = 1;
  string companion_id = 2;
  string run_id = 3;
  string operation = 4;
  string receiver = 5;
  string effect = 6;
  string arguments_json = 7;
  string digest = 8;
  bool card_only = 9;
  string device_id = 10;
}
message ApprovalAnswer {
  Mutation mutation = 1;
  string id = 2;
  string digest = 3;
  enum Choice {
    CHOICE_UNSPECIFIED = 0;
    CHOICE_ALLOW = 1;
    CHOICE_ALWAYS_ALLOW = 2;
    CHOICE_DENY = 3;
  }
  Choice choice = 4;
}
message Plugin {
  string id = 1;
  int64 revision = 2;
  string path = 3;
  bool enabled = 4;
  string label = 5;
  repeated string destinations = 6;
  repeated string capabilities = 7;
  string package_digest = 8;
}
message PluginChange {
  Mutation mutation = 1;
  Plugin plugin = 2;
}

message WorkSession {
  string id = 1;
  string companion_id = 2;
  repeated Run runs = 3;
}
message Run {
  string id = 1;
  string instruction = 2;
  string report = 3;
  Outcome outcome = 4;
  int64 started_at = 5;
}
message WorkInput {
  Mutation mutation = 1;
  string companion_id = 2;
  string session_id = 3;
  string instruction = 4;
}
message WorkList {
  repeated WorkSession items = 1;
}

message AudioInput {
  string device_id = 1;
  uint64 generation = 2;
  bytes pcm = 3;
  uint32 sample_rate = 4;
  bool commit = 5;
  bool interrupt = 6;
  string request_key = 7;
  bool diagnostic = 8;
}
message Transcription {
  string text = 1;
  string id = 2;
}
message AudioSubscription {
  string device_id = 1;
  uint64 generation = 2;
}
message AudioOutput {
  string utterance_id = 1;
  string companion_id = 2;
  uint64 generation = 3;
  bytes pcm = 4;
  uint32 sample_rate = 5;
  bool stop = 6;
  bool end = 7;
}
message SpeakRequest {
  Mutation mutation = 1;
  string companion_id = 2;
  string text = 3;
}

message Capability {
  string name = 1;
  string schema_json = 2;
  string description = 3;
}
message Device {
  string id = 1;
  string label = 2;
  repeated Capability capabilities = 3;
  bool eyes_enabled = 4;
}
message DeviceChange {
  Mutation mutation = 1;
  Device device = 2;
}
message ActivationRequest {
  Mutation mutation = 1;
  string device_id = 2;
  string companion_id = 3;
  bool only_if_unassigned = 4;
}
message Activation {
  string device_id = 1;
  uint64 generation = 2;
  string companion_id = 3;
}
message Perception {
  string device_id = 1;
  uint64 generation = 2;
  string observation = 3;
  string interpretation = 4;
}
message DeviceOperation {
  string id = 1;
  string device_id = 7;
  string capability = 2;
  string arguments_json = 3;
  uint64 generation = 4;
  string companion_id = 5;
  string run_id = 6;
}
message DeviceClaim {
  string device_id = 1;
  uint64 generation = 2;
  string operation_id = 3;
}
message DeviceResult {
  string device_id = 1;
  uint64 generation = 2;
  string operation_id = 3;
  Outcome outcome = 4;
  string result_json = 5;
  ScreenFrame frame = 6;
}
message ScreenFrame {
  string id = 1;
  uint32 width = 2;
  uint32 height = 3;
  bytes jpeg = 4;
}

service HostService {
  rpc GetSnapshot(Empty) returns (Snapshot);
  rpc Subscribe(SubscribeRequest) returns (stream Event);
  rpc PutCharacter(CharacterChange) returns (Character);
  rpc DeleteCharacter(DeleteRequest) returns (Empty);
  rpc PutCompanion(CompanionChange) returns (Companion);
  rpc DeleteCompanion(DeleteRequest) returns (Empty);
  rpc Preview(PreviewRequest) returns (Text);
  rpc ExportCharacter(ExportRequest) returns (CharacterPackage);
  rpc ImportCharacter(ImportRequest) returns (Character);
  rpc GetMind(Id) returns (Mind);
  rpc PutMind(MindChange) returns (Mind);
  rpc SearchMemories(MemoryQuery) returns (Memories);
  rpc ChangeMemory(MemoryChange) returns (Memory);
}

service ChatService {
  rpc Send(SendRequest) returns (Receipt);
  rpc Stop(StopRequest) returns (Empty);
  rpc GetHistory(HistoryRequest) returns (History);
}

service SettingsService {
  rpc Get(Empty) returns (Settings);
  rpc ResetHistory(Empty) returns (Empty);
  rpc PutConnection(ConnectionChange) returns (Connection);
  rpc DeleteConnection(DeleteRequest) returns (Empty);
  rpc SetCredential(CredentialChange) returns (Empty);
  rpc Models(Id) returns (ModelList);
  rpc McpTools(Id) returns (ModelList);
  rpc Probe(ProbeRequest) returns (Empty);
  rpc PutPolicy(PolicyChange) returns (Policy);
  rpc DeleteRule(DeleteRequest) returns (Empty);
  rpc AuditHistory(AuditQuery) returns (Audit);
  rpc Answer(ApprovalAnswer) returns (Empty);
  rpc PutPlugin(PluginChange) returns (Plugin);
  rpc DeletePlugin(DeleteRequest) returns (Empty);
}

service WorkService {
  rpc List(Empty) returns (WorkList);
  rpc Send(WorkInput) returns (Receipt);
  rpc Stop(StopRequest) returns (Empty);
}

service VoiceService {
  rpc Input(stream AudioInput) returns (stream Transcription);
  rpc Output(AudioSubscription) returns (stream AudioOutput);
  rpc Speak(SpeakRequest) returns (Empty);
}

service ClientService {
  rpc RegisterDevice(DeviceChange) returns (Device);
  rpc Activate(ActivationRequest) returns (Activation);
  rpc ReportPerception(Perception) returns (Empty);
  rpc Operations(AudioSubscription) returns (stream DeviceOperation);
  rpc Claim(DeviceClaim) returns (DeviceOperation);
  rpc Complete(DeviceResult) returns (Empty);
}
