[package]
name = "ene-rpc"
description = "Generated ene Connect RPC contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true
[features]
client = ["connectrpc/client", "dep:http", "dep:url"]
client-tls = ["client", "connectrpc/client-tls", "dep:rustls-native-certs"]

[dependencies]
serde_json.workspace = true
serde.workspace = true
buffa.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
http = { workspace = true, optional = true }
url = { workspace = true, optional = true }
rustls-native-certs = { version = "0.8", optional = true }
connectrpc.workspace = true

[build-dependencies]
buffa-build = "0.9"
connectrpc-build = "0.9"

# `OUT_DIR/_connectrpc.rs` (included via `include!`) uses `buffa` and `serde_json`.
[package.metadata.cargo-machete]
ignored = ["buffa", "serde_json"]
