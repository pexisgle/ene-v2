[package]
name = "ene-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
client = ["connectrpc/client", "dep:http", "dep:url"]
client-tls = ["client", "connectrpc/client-tls", "dep:rustls-native-certs"]

[dependencies]
buffa.workspace = true
connectrpc.workspace = true
http = { workspace = true, optional = true }
rustls-native-certs = { version = "0.8", optional = true }
serde.workspace = true
serde_json.workspace = true
url = { workspace = true, optional = true }

[build-dependencies]
connectrpc-build = "0.9"

[package.metadata.cargo-machete]
ignored = ["buffa", "serde", "serde_json", "connectrpc-build"]

[lints]
workspace = true
