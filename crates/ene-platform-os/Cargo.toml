[package]
name = "ene-platform-os"
description = "OS integration (tray, overlays, screen capture, input injection) behind safe abstractions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
parking_lot.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tray-icon.workspace = true
winit.workspace = true
xcap.workspace = true
# JPEG encoding for screen capture; the desktop crate no longer needs it.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.14", features = ["screensaver"] }
