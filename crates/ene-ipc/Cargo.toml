[package]
name = "ene-ipc"
description = "Feature-separated IPC contracts and Remoc transport for Rust child processes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true
[features]
default = []
renderer = ["dep:serde", "dep:uuid"]
provider-plugin = ["dep:serde", "dep:ene-api-types", "dep:serde_json", "rpc", "remoc/codec-message-pack", "dep:thiserror"]
transport = ["dep:remoc"]
rpc = ["transport", "remoc/rtc"]

[dependencies]
ene-api-types = { path = "../ene-api-types", optional = true }
thiserror = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
uuid = { version = "1", features = ["serde", "v4"], optional = true }
remoc = { version = "0.20", default-features = false, features = ["rch"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde.workspace = true
tokio = { workspace = true, features = ["rt", "process", "io-std"] }

[[example]]
name = "worker"
required-features = ["rpc"]
