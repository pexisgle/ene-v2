[package]
name = "ene-ipc"
description = "Avatar renderer-desktop IPC contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true
[features]
default = []
renderer = ["dep:serde", "dep:remoc", "dep:thiserror"]

[dependencies]
remoc = { workspace = true, optional = true }
thiserror = { version = "2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
