[package]
name = "ene-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true
[features]
# Explicitly enabled only by adapter contract tests, never by normal host builds.
test-support = []
[dependencies]
ene-api-types = { path = "../ene-api-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
http = "1"
bytes = "1"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1", default-features = false, features = ["sync", "rt", "time", "macros"] }
tokio-util.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
uuid = { version = "1", features = ["v4"] }

time = { version = "0.3", features = ["formatting"] }
