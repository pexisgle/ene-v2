[package]
name = "ene-python"
description = "Python provider SDK backed by the Rust Remoc contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "ene_provider"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
ene-ipc = { workspace = true, features = ["provider-plugin"] }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pythonize = "0.29"
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "process"] }
tokio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
