[package]
name = "ene-plugin"
description = "Plugin manifests, extension APIs and Extism guest SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
# Types only: the ACP SDK does not build for `wasm32-unknown-unknown`.
agent-client-protocol-schema.workspace = true
serde.workspace = true
# `default-features = false` keeps the guest build free of std-only machinery.
serde_json.workspace = true

[features]
runtime = [
    "dep:anyhow", "dep:async-task", "dep:blocking", "dep:cap-fs-ext", "dep:cap-std",
    "dep:extism", "dep:futures-util", "dep:hex", "dep:parking_lot", "dep:rustix",
    "dep:sha2", "dep:tokio", "dep:tokio-util", "dep:tracing", "dep:wasmtime",
]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
anyhow = { version = "1", optional = true }
async-task = { version = "4", optional = true }
blocking = { version = "1", optional = true }
cap-fs-ext = { workspace = true, optional = true }
cap-std = { workspace = true, optional = true }
extism = { version = "1.41.0", default-features = false, optional = true }
futures-util = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
wasmtime = { version = "49", default-features = false, features = ["pooling-allocator"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
wat = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
# The Wasm plugin tests exercise this guest SDK against the host runtime.
extism-pdk = { version = "1.4.1", default-features = false }

[[example]]
name = "reference"
crate-type = ["cdylib"]
