[package]
name = "ene-platform"
description = "OS paths, protected storage and isolated processes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt", "process", "io-util", "net"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
xdg = "3"
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Environment"] }

[dev-dependencies]
tempfile = "3"
