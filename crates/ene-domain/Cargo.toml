[package]
name = "ene-domain"
description = "Shared pure domain types for clients, settings, work sessions, runs, and failures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
croner.workspace = true
jiff.workspace = true
ene-catalog.workspace = true
ene-policy.workspace = true
hashlink.workspace = true
http.workspace = true
jsonschema.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
tracing.workspace = true
rusqlite = { workspace = true, optional = true }
url.workspace = true
uuid = { version = "1", default-features = false }

[features]
# `ene-store` needs `ToSql`/`FromSql` for the branded ids, and the orphan rule
# puts those impls here. Off by default so the pure-domain build stays free of
# rusqlite.
sqlite = ["dep:rusqlite"]
