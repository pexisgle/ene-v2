[package]
name = "ene-vrm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_animation", "bevy_gltf", "bevy_pbr", "bevy_render", "bevy_shader", "bevy_world_serialization", "gltf_animation", "morph_animation"] }
gltf = { version = "1.4", default-features = false, features = ["extensions", "KHR_texture_transform"] }
petgraph = "0.8"
serde.workspace = true
serde_json = "1"
# `gltf_index` is required: vrm-spec 0.1.1 does not compile without it.
vrm-spec = { version = "0.1.1", default-features = false, features = ["gltf_index"] }

[dev-dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["bevy_window", "bevy_log", "png"] }

[target.'cfg(windows)'.dev-dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["bevy_winit"] }
