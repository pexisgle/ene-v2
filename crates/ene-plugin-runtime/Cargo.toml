[package]
name = "ene-plugin-runtime"
description = "Verified plugin packages and isolated worker supervision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
ene-platform = { path = "../ene-platform" }
ene-ipc = { workspace = true, features = ["host-plugin"] }
ene-api-types = { path = "../ene-api-types" }
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
[dev-dependencies]
tokio = { workspace = true, features = ["io-std", "rt"] }
tempfile = "3"

[[test]]
name = "native_process"
harness = false
