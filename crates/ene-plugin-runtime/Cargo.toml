[package]
name = "ene-plugin-runtime"
description = "Verified WebAssembly plugins embedded through the Extism Host SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
parking_lot.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
hex.workspace = true
ene-plugin.workspace = true
base64.workspace = true
reqwest.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "macros"] }
tokio-util.workspace = true
futures-util.workspace = true
http-body-util = "0.1"
thiserror.workspace = true
tracing.workspace = true
serde_json = "1"
serde.workspace = true
sha2.workspace = true
# The host SDK embeds the Extism runtime and pins the wasmtime 49 line that
# this crate configures below, so it stays exact.
extism = { version = "=1.41.0", default-features = false }
wasmtime = { version = "49", default-features = false, features = ["pooling-allocator"] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

wat = "1"
