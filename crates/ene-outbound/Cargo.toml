[package]
name = "ene-outbound"
description = "Host-authorized, bounded external HTTP transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ene-core.workspace = true
http.workspace = true
bytes.workspace = true
url.workspace = true
rig-http = "0.44"
futures-util = { workspace = true, features = ["sink"] }
tokio = { workspace = true, default-features = true, features = ["rt", "rt-multi-thread", "io-util", "net", "process"] }
async-stream.workspace = true

[dev-dependencies]
ene-rpc.workspace = true
axum.workspace = true
ene-core = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
