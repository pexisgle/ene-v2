name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"
          github_token: ${{ github.token }}

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-on-failure: true
          cache-key: v2

      - name: Linux checks
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # clang and lld are required by .cargo/config.toml's Linux linker.
          # libasound2-dev is required by cpal, which ene-desktop uses for audio.
          sudo apt-get install -y clang lld pkg-config libwayland-dev libxkbcommon-dev libvulkan-dev mesa-vulkan-drivers libvulkan1 libasound2-dev
          cargo fmt --all -- --check
          cargo clippy --profile ci --locked -p ene-plugin -p ene-openrouter-wasm -p ene-reference-wasm --target wasm32-unknown-unknown -- -D warnings
          cargo check --profile ci --locked -p ene-rpc --target wasm32-unknown-unknown --all-features

      - name: Build test Wasm plugin
        run: |
          cargo build --release --locked -p ene-openrouter-wasm -p ene-reference-wasm --target wasm32-unknown-unknown

      - name: Clippy and tests
        run: |
          cargo clippy --profile ci --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --profile ci --workspace --all-features --locked

      - name: Native Wasm tool-call regressions
        run: |
          cargo test --profile ci --locked -p ene-host --lib host::model::plugin_tests -- --test-threads=1

      - name: GPU tests
        if: runner.os == 'Linux'
        run: |
          WGPU_BACKEND=vulkan cargo test --profile ci -p ene-vrm --locked --lib material::tests -- --ignored --nocapture --test-threads=1
