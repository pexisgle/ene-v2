name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          targets: wasm32-unknown-unknown
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libwayland-dev libxkbcommon-dev libfontconfig1-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy Wasm SDK and plugins
        run: cargo clippy --locked -p ene-plugin -p ene-openrouter-wasm -p ene-reference-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Build Wasm plugin
        run: cargo build --release --locked -p ene-openrouter-wasm -p ene-reference-wasm --target wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test Wasm plugins
        run: |
          npm install --no-save --package-lock=false @extism/extism@2.0.0-rc13
          node examples/plugins/openrouter-wasm/test.cjs target/wasm32-unknown-unknown/release/ene_openrouter_wasm.wasm
      - name: Tests
        run: cargo test --workspace --all-features --locked
      - name: Check Wasm RPC messages
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p ene-rpc --target wasm32-unknown-unknown --all-features --locked

  gpu-smoke:
    name: GPU smoke (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libwayland-dev libxkbcommon-dev libfontconfig1-dev libvulkan1 mesa-vulkan-drivers
      - name: MToon GPU smoke
        env:
          WGPU_BACKEND: vulkan
        run: |
          cargo test -p ene-vrm material::tests --locked -- --ignored --nocapture --test-threads=1
