name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          targets: wasm32-unknown-unknown
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libwayland-dev libxkbcommon-dev libfontconfig1-dev bubblewrap
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build Wasm plugin
        run: cargo build --release --locked -p ene-openrouter-wasm --target wasm32-unknown-unknown
      - name: Build plugin runner
        run: cargo build --locked -p ene-plugin-runner
      - name: Tests
        run: cargo test --workspace --all-features --locked
      - name: Test Wasm plugin with runner
        env:
          ENE_TEST_PDK_WASM: ${{ github.workspace }}/target/wasm32-unknown-unknown/release/ene_openrouter_wasm.wasm
        run: cargo test --locked -p ene-plugin-runner --test pdk -- --ignored

  gpu-smoke:
    name: GPU smoke (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config libwayland-dev libxkbcommon-dev libfontconfig1-dev libvulkan1 mesa-vulkan-drivers
      - name: MToon GPU smoke
        env:
          WGPU_BACKEND: vulkan
        run: |
          cargo test -p ene-vrm material::tests --locked -- --ignored --nocapture --test-threads=1
