name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-on-failure: true
          cache-key: v2

      - name: Linux checks
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # clang and lld are required by .cargo/config.toml's Linux linker.
          sudo apt-get install -y clang lld pkg-config libwayland-dev libxkbcommon-dev libvulkan-dev mesa-vulkan-drivers libvulkan1
          cargo fmt --all -- --check
          cargo clippy --profile ci --locked -p ene-plugin -p ene-openrouter-wasm -p ene-reference-wasm --target wasm32-unknown-unknown -- -D warnings
          cargo check --profile ci --locked -p ene-rpc --target wasm32-unknown-unknown --all-features
          cargo build --release --locked -p ene-openrouter-wasm -p ene-reference-wasm --target wasm32-unknown-unknown

      - name: Clippy and tests
        run: |
          cargo clippy --profile ci --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --profile ci --workspace --all-features --locked

      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: 24
          package-manager-cache: false

      - name: Wasm and GPU tests
        if: runner.os == 'Linux'
        run: |
          npm install --no-save --package-lock=false @extism/extism@2.0.0-rc13
          node examples/plugins/openrouter-wasm/test.cjs target/wasm32-unknown-unknown/release/ene_openrouter_wasm.wasm
          WGPU_BACKEND=vulkan cargo test --profile ci -p ene-vrm --all-features --locked --lib material::tests -- --ignored --nocapture --test-threads=1
