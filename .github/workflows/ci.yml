name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"
          github_token: ${{ github.token }}

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-on-failure: true
          cache-key: v2

      - name: Linux checks
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # clang and lld are required by .cargo/config.toml's Linux linker.
          # libasound2-dev is required by cpal, which ene-desktop uses for audio.
          sudo apt-get install -y clang lld pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libfontconfig1-dev libvulkan-dev mesa-vulkan-drivers libvulkan1 libasound2-dev
          cargo fmt --all -- --check
          python3 scripts/check-architecture.py --self-test
          python3 scripts/check-architecture.py
          cargo clippy --profile ci --locked -p ene-plugin -p ene-openrouter-wasm -p ene-reference-wasm --target wasm32-unknown-unknown -- -D warnings
          cargo check --profile ci --locked -p ene-rpc --target wasm32-unknown-unknown --all-features

      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-deny,cargo-machete

      - name: Dependency and license checks
        if: runner.os == 'Linux'
        run: |
          cargo deny check
          cargo machete

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Build test Wasm plugin
        run: |
          cargo build --release --locked -p ene-openrouter-wasm -p ene-reference-wasm --target wasm32-unknown-unknown

      - name: Clippy and tests
        run: |
          # The three staged lints are `warn` in [workspace.lints.clippy]; they are
          # exempt from -D warnings until their scheduled clean-up (PR-4.3, PR-5.1).
          cargo clippy --profile ci --workspace --all-targets --all-features --locked -- \
            -D warnings \
            -A clippy::undocumented_unsafe_blocks \
            -A clippy::multiple_unsafe_ops_per_block \
            -A clippy::let_underscore_must_use
          cargo nextest run --profile ci --workspace --all-features --locked --no-fail-fast

      - name: Native Wasm tool-call regressions
        run: |
          cargo test --profile ci --locked -p ene-host --lib host::model::plugin_tests -- --test-threads=1

      - name: GPU tests
        if: runner.os == 'Linux'
        run: |
          WGPU_BACKEND=vulkan cargo test --profile ci -p ene-vrm --locked --lib material::tests -- --ignored --nocapture --test-threads=1
