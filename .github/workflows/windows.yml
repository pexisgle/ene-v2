name: Verify Windows
on:
  push:
    branches: [port/plugin-runtime]
  pull_request:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-07
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo --config "profile.dev.package.'*'.opt-level=0" check --workspace --all-targets --all-features --locked
      - run: cargo --config "profile.dev.package.'*'.opt-level=0" clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo --config "profile.dev.package.'*'.opt-level=0" build --locked -p ene-plugin-runner
      - run: cargo --config "profile.dev.package.'*'.opt-level=0" test --workspace --all-features --locked
      - run: cargo build --release --locked -p ene-openrouter-wasm --target wasm32-unknown-unknown
      - shell: pwsh
        run: |
          $env:ENE_TEST_PDK_WASM = "$PWD/target/wasm32-unknown-unknown/release/ene_openrouter_wasm.wasm"
          cargo --config "profile.dev.package.'*'.opt-level=0" test --locked -p ene-plugin-runner --test pdk -- --ignored
