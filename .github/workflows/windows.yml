name: Verify Windows
on:
  push:
    branches: [port/plugin-runtime]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-07
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --locked -p ene-plugin-runner
      - run: cargo test --workspace --all-features --locked
      - run: cargo build --release --locked -p ene-openrouter-wasm --target wasm32-unknown-unknown
      - run: python scripts/check-wasm-plugin.py
