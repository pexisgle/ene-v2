[package]
name = "ene-host-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-stream.workspace = true
axum.workspace = true
bevy_ecs = "=0.20.0"
buffa.workspace = true
bytes.workspace = true
connectrpc = { workspace = true, features = ["axum", "client"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "6"
futures-util.workspace = true
http.workspace = true
io-lifetimes = "3"
private-fs = "0.2.1"
reqwest.workspace = true
rig-core = { version = "=0.46.0", default-features = false }
rig-ecs = "=0.46.0"
rig-http = "=0.46.0"
rig-memory = { version = "=0.46.0", features = ["fs"] }
rig-reqwest = { version = "=0.46.0", features = ["rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-std", "io-util"] }
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
rig-core = { version = "0.46", default-features = false, features = ["test-utils"] }
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
connectrpc-build = "0.9.0"
