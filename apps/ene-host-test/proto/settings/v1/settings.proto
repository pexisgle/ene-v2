syntax = "proto3";
package settings.v1;

message Settings {
  string endpoint = 1;
  string companion_model = 2;
  string work_model = 3;
  bool declare_tool_calling = 4;
  bool model_allowed = 5;
  bool tools_allowed = 6;
  uint64 revision = 7;
}
message GetSettingsRequest { string companion_id = 1; }
message SetSettingsRequest {
  string companion_id = 1;
  uint64 expected_revision = 2;
  Settings settings = 3;
}
service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (Settings);
  rpc SetSettings(SetSettingsRequest) returns (Settings);
}
