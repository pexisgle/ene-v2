[package]
name = "ene-host"
description = "Host application, authorized provider communication and process entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
http.workspace = true
reqwest.workspace = true
rig-http = "0.46"
ene-rpc.workspace = true
ene-plugin.workspace = true
agent-client-protocol.workspace = true
process-wrap.workspace = true
which.workspace = true
unicode-segmentation.workspace = true
connectrpc = { workspace = true, features = ["axum"] }
buffa.workspace = true
bytes.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
ene-plugin-runtime.workspace = true
rig-core = { version = "0.46", default-features = false, features = [] }
rig-ecs = "0.46"
rig-memory = { version = "0.46", features = ["fs"] }
bevy_ecs = "=0.20.0"
keyring = { version = "4", default-features = false, features = ["v1"] }
time.workspace = true
thiserror.workspace = true
rusqlite_migration = "2"
axum.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle = "2"
tokio = { workspace = true, default-features = true, features = ["rt-multi-thread", "net", "signal", "process", "io-util"] }
tokio-rusqlite = { version = "0.8", features = ["bundled"] }
uuid.workspace = true

url.workspace = true
async-stream.workspace = true
base64.workspace = true
sha2.workspace = true
tokio-util = { workspace = true, features = ["compat"] }

[dev-dependencies]
rig-core = { version = "0.46", default-features = false, features = ["test-utils"] }
tempfile.workspace = true
wat = "1"
dotenvy = "0.15"
keyring-core = "1"
tokio = { workspace = true, default-features = true, features = ["test-util"] }
ene-rpc = { workspace = true, features = ["client"] }
http.workspace = true
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
xdg.workspace = true
rustix.workspace = true
