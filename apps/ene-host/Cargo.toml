[package]
name = "ene-host"
description = "Host application, agent execution and authenticated provider communication"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
agent-client-protocol.workspace = true
async-stream.workspace = true
axum.workspace = true
bevy_ecs = "=0.20.0"
bytes.workspace = true
connectrpc = { workspace = true, features = ["axum"] }
croner.workspace = true
crossbeam-channel = "0.5"
directories = "6"
ene-rpc.workspace = true
futures-util.workspace = true
hound.workspace = true
chrono.workspace = true
http.workspace = true
io-lifetimes = "3"
jiff.workspace = true
keyring = { version = "4", default-features = false, features = ["v1"] }
private-fs = "0.2.1"
process-wrap.workspace = true
reqwest.workspace = true
rig-core = { version = "=0.46.0", default-features = false }
rig-ecs = "=0.46.0"
rig-http = "=0.46.0"
rig-memory = { version = "=0.46.0", features = ["fs"] }
rig-reqwest = { version = "=0.46.0", features = ["rustls"] }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
time.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "io-util", "process"] }
tokio-util = { workspace = true, features = ["rt", "compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url.workspace = true
uuid.workspace = true
which.workspace = true

[dev-dependencies]
ene-rpc = { workspace = true, features = ["client"] }
rig-core = { version = "=0.46.0", default-features = false, features = ["test-utils"] }
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
