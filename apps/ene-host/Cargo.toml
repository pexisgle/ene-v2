[package]
name = "ene-host"
description = "ene host process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
utoipa = { version = "5.4", features = ["axum_extras"] }
utoipa-axum = "0.2"
ene-api-types = { path = "../../crates/ene-api-types", features = ["openapi"] }
ene-core = { path = "../../crates/ene-core" }
xdg = "3"
rig-core = { version = "0.43", default-features = false, features = ["reqwest", "rustls"] }
keyring = { version = "4.2", default-features = false, features = ["v1"] }
time = { version = "0.3", features = ["formatting"] }
clap.workspace = true
rustix.workspace = true
thiserror.workspace = true
rusqlite_migration = "2.6"
atomic-write-file = { version = "0.3", features = ["unnamed-tmpfile"] }
axum = { version = "0.8", features = ["ws"] }
ene-protocol = { path = "../../crates/ene-protocol" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std", "async-await"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-rusqlite = { version = "0.8", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
ene-api-client = { path = "../../crates/ene-api-client" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
