[package]
name = "ene-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
agent-client-protocol = "5.6.1"
async-stream.workspace = true
axum = { workspace = true, features = ["http2"] }
base64.workspace = true
buffa.workspace = true
bytes.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
clap.workspace = true
connectrpc = { workspace = true, features = ["axum"] }
croner.workspace = true
directories = "6"
ene-core.workspace = true
ene-plugin = { workspace = true, features = ["runtime"] }
ene-rpc.workspace = true
futures-util.workspace = true
getrandom = "0.4"
hex.workspace = true
http.workspace = true
http-body-util.workspace = true
io-lifetimes = "3"
ignore = "0.4"
jsonschema.workspace = true
jiff.workspace = true
keyring-core = "1"
once_cell = "1"
parking_lot.workspace = true
private-fs = "0.2.1"
process-wrap.workspace = true
reqwest.workspace = true
rig-core.workspace = true
rig-reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite", "runtime-tokio", "derive", "migrate", "json", "macros"] }
subtle = "2"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "io-util", "process", "fs"] }
tokio-util = { workspace = true, features = ["compat"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
ene-rpc = { workspace = true, features = ["client"] }
tempfile = "3"

[lints]
workspace = true
