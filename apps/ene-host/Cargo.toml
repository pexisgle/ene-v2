[package]
name = "ene-host"
description = "ene host process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
utoipa = { version = "5.4", features = ["axum_extras"] }
utoipa-axum = "0.2"
ene-api-types = { path = "../../crates/ene-api-types", features = ["openapi"] }
ene-core = { path = "../../crates/ene-core" }
xdg = "3"
rig-core = { version = "0.43", default-features = false, features = [] }
keyring = { version = "4.2", default-features = false, features = ["v1"] }
time = { version = "0.3", features = ["formatting"] }
clap.workspace = true
rustix.workspace = true
thiserror.workspace = true
rusqlite_migration = "2.6"
atomic-write-file = { version = "0.3", features = ["unnamed-tmpfile"] }
axum = { version = "0.8", features = ["ws"] }
ene-protocol = { path = "../../crates/ene-protocol", features = ["ipc"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std", "async-await"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }
tokio-rusqlite = { version = "0.8", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

ene-outbound = { path = "../../crates/ene-outbound" }
url = "2"
async-stream = "0.3"
base64 = "0.22"
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["rt"] }

tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
ene-core = { path = "../../crates/ene-core", features = ["test-support"] }
ene-api-client = { path = "../../crates/ene-api-client" }
tower = { version = "0.5", features = ["util"] }
