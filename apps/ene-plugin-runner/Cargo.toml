[package]
name = "ene-plugin-runner"
description = "Extism and Luau isolated plugin worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
ene-ipc = { workspace = true, features = ["host-plugin"] }
ene-plugin-runtime = { path = "../../crates/ene-plugin-runtime" }
clap.workspace = true
tokio = { workspace = true, features = ["io-std", "rt-multi-thread"] }
tokio-util.workspace = true
futures-util.workspace = true
serde_json = "1"
base64 = "0.22"
anyhow = "1"
extism = { version = "=1.41.0", default-features = false }
mlua = { version = "=0.11.6", features = ["luau", "async", "serialize", "error-send"] }
mlua-luau-scheduler = "=0.2.4"
[dev-dependencies]
base64 = "0.22"
ene-platform = { path = "../../crates/ene-platform" }
tempfile = "3"
wat = "1"
