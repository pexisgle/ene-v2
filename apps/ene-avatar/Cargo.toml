[package]
name = "ene-avatar"
description = "VRM 1.0 Wayland companion renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ene-shared = { path = "../../crates/ene-shared" }
bevy = { version = "=0.19.1", default-features = false, features = ["reflect_auto_register", "bevy_world_serialization", "bevy_log", "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_scene", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_gltf", "bevy_animation", "bevy_camera", "bevy_light", "bevy_image", "bevy_mesh", "bevy_window", "png", "morph", "morph_animation"] }
bevy_vrm1 = { version = "=0.9.5", default-features = false }
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop"] }
wayland-client = { version = "0.31", features = ["system"] }
raw-window-handle = "0.6"
serde_json = "1"
png = "0.18"

tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
