[package]
name = "ene-avatar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_animation", "bevy_color", "bevy_core_pipeline", "bevy_gltf", "bevy_image", "bevy_light", "bevy_log", "bevy_mesh", "bevy_pbr", "bevy_render", "bevy_shader", "bevy_window", "bevy_world_serialization", "gltf_animation", "png", "morph_animation", "reflect_auto_register"] }
ene-vrm = { path = "../../crates/ene-vrm" }
serde.workspace = true
serde_json = "1"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["bevy_winit", "statically-linked-dxc"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
exwlshellev = "0.20.1"
