[package]
name = "ene-avatar"
description = "VRM 1.0 Wayland companion renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
dev-dynamic-linking = ["bevy/dynamic_linking"]

[dependencies]
ene-platform.workspace = true
serde = { version = "1", features = ["derive"] }
binrw = "0.15"
gltf-json = { version = "1", features = ["extensions"] }
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-std"] }
futures-util.workspace = true

ene-ipc = { path = "../../crates/ene-ipc", default-features = false, features = ["renderer", "transport"] }
# bevy_vrm1 0.10 uses Bevy 0.19; direct WGPU types must match Bevy's WGPU 29.
bevy = { version = "0.19", default-features = false, features = ["reflect_auto_register", "bevy_world_serialization", "bevy_log", "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_scene", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_gltf", "bevy_animation", "bevy_camera", "bevy_light", "bevy_image", "bevy_mesh", "bevy_window", "png", "morph", "morph_animation"] }
bevy_vrm1 = { version = "0.10", default-features = false }
serde_json = "1"
wgpu = { version = "29", default-features = false, features = ["wgsl"] }
raw-window-handle = "0.6"

tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }

[target.'cfg(unix)'.dependencies]
wgpu = { version = "29", default-features = false, features = ["vulkan"] }
rustix.workspace = true
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
wayland-client = { version = "0.31", features = ["system"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "29", default-features = false, features = ["dx12"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_Graphics_DirectComposition", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
