[package]
name = "ene-desktop"
description = "Desktop client: GUI, host connection, avatar control, perception and audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
backon.workspace = true
parking_lot.workspace = true
ene-avatar-ipc.workspace = true
ene-client-core.workspace = true
ene-domain.workspace = true
ene-platform-os.workspace = true
ene-plugin.workspace = true
ene-plugin-runtime.workspace = true
ene-rpc = { workspace = true, features = ["client", "client-tls"] }
ene-voice.workspace = true
base64.workspace = true
buffa.workspace = true
cap-std.workspace = true
connectrpc.workspace = true
directories = "6"
gpui.workspace = true
globset = "0.4"
process-wrap.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "process", "io-util", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.18"
earshot = "1.2.2"
regex = "1"
unicode-segmentation = "1"
uuid.workspace = true

# gpui's Linux backends are features, and the workspace pins the crate with
# default-features off (so its Windows manifest is not embedded twice). A Linux
# window therefore needs them named here.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui = { workspace = true, features = ["wayland", "x11"] }
# gpui 0.2.2 pulls zed-async-tar -> xattr 0.2.3, which uses libc::ENOATTR
# removed on Linux in libc 0.2.190.
libc = ">=0.2.186, <0.2.190"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.13", features = ["screensaver"] }

# Workspace::open finds bash with which on every non-Windows platform.
[target.'cfg(not(windows))'.dependencies]
which.workspace = true

# libc is a deliberate transitive-graph pin (see the target section above),
# not a direct dependency, so nothing in src/ names it.
[package.metadata.cargo-machete]
ignored = ["libc"]
