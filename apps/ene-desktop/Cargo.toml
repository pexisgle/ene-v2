[package]
name = "ene-desktop"
description = "ene desktop client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ene-api-types.workspace = true
ene-api-client.workspace = true
uuid.workspace = true
ashpd = { version = "0.13", default-features = false, features = ["tokio", "file_chooser"] }
ksni = "0.3"
url.workspace = true
clap.workspace = true
tokio = { workspace = true, default-features = true, features = ["rt", "rt-multi-thread", "io-util", "net", "process"] }
tokio-util = { workspace = true, features = ["codec"] }
futures-util = { workspace = true, features = ["sink"] }
rustix.workspace = true

atomic-write-file.workspace = true
ene-ipc = { workspace = true, features = ["renderer", "transport"] }
xdg.workspace = true
serde.workspace = true
serde_json.workspace = true
slint = { workspace = true, features = ["std", "compat-1-2", "backend-winit-wayland", "renderer-femtovg-wgpu", "unstable-fontique-011"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
lucide-slint = "1"
slint-build = { version = "1", default-features = false, features = ["compat-1-18"] }

[dev-dependencies]
buffa.workspace = true
connectrpc.workspace = true
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-std"] }
slint = { workspace = true, features = ["renderer-software"] }
