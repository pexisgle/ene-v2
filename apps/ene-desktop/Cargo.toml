[package]
name = "ene-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
buffa.workspace = true
clap.workspace = true
connectrpc.workspace = true
cpal = "0.18"
directories = "6"
private-fs = "0.2.1"
ene-core.workspace = true
ene-plugin = { workspace = true, features = ["runtime"] }
ene-rpc = { workspace = true, features = ["client-tls"] }
enigo = "0.6"
gpui.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
process-wrap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "process", "io-util", "fs"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
tracing.workspace = true
tracing-subscriber = "0.3"
uuid.workspace = true

[lints]
workspace = true

[build-dependencies]
embed-resource = "3"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["screenshot", "async-io"] }
ksni = "0.3.8"
rustix.workspace = true
url.workspace = true
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.14", features = ["screensaver"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.27", default-features = false }
winit = { version = "0.30.13", default-features = false }
xcap = { version = "0.9.10", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_StationsAndDesktops", "Win32_UI_HiDpi", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
