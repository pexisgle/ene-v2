[package]
name = "ene-desktop"
description = "Desktop client: GUI, host connection, avatar control, perception and audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ene-rpc = { workspace = true, features = ["client"] }
buffa.workspace = true
connectrpc.workspace = true
directories = "6"
futures-util.workspace = true
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "process", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.18"
rubato.workspace = true
regex = "1"
unicode-segmentation = "1"
uuid.workspace = true

# gpui's Linux backends are features, and the workspace pins the crate with
# default-features off (so its Windows manifest is not embedded twice). A Linux
# window therefore needs them named here.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile.workspace = true
