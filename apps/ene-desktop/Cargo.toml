[package]
name = "ene-desktop"
description = "ene desktop client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
atomic-write-file = { version = "0.3", features = ["unnamed-tmpfile"] }
ene-shared = { path = "../../crates/ene-shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "renderer-femtovg-wgpu", "system-tray"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[build-dependencies]
slint-build = { version = "=1.18.1", default-features = false, features = ["compat-1-18"] }

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
