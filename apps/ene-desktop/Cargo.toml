[package]
name = "ene-desktop"
description = "Desktop client: GUI, host connection, avatar control, perception and audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap.workspace = true
backon.workspace = true
parking_lot.workspace = true
ene-avatar-ipc.workspace = true
ene-client-core.workspace = true
ene-domain.workspace = true
ene-platform-os.workspace = true
ene-plugin.workspace = true
ene-plugin-runtime.workspace = true
ene-rpc = { workspace = true, features = ["client", "client-tls"] }
ene-voice.workspace = true
base64.workspace = true
buffa.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
cap-tempfile = "4.0.3"
connectrpc.workspace = true
directories = "6"
gpui.workspace = true
globset = "0.4"
process-wrap.workspace = true
schemars.workspace = true
scopeguard = { version = "1", default-features = false }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "process", "io-util", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.18"
earshot = "1.2.2"
regex = "1"
uuid.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

# Workspace::open finds bash with which on every non-Windows platform.
[target.'cfg(not(windows))'.dependencies]
which.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
libc = "0.2"
